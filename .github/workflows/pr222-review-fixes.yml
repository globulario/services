name: PR 222 review fixes

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

env:
  GOWORK: "off"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: github.event.pull_request.number == 222 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout services branch
        uses: actions/checkout@v4
        with:
          path: services
          ref: split/2-explicit-placement-contract
          fetch-depth: 1

      - name: Checkout utility
        uses: actions/checkout@v4
        with:
          repository: globulario/utility
          path: utility

      - name: Checkout globular-installer
        uses: actions/checkout@v4
        with:
          repository: globulario/globular-installer
          path: globular-installer

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y unixodbc-dev

      - name: Apply asserted source transformations
        working-directory: services
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pr222-review-fixes.py scripts/pr222-review-fixes-v2.py
          python3 scripts/pr222-review-fixes-v2.py
          gofmt -w \
            golang/cluster_controller/cluster_controller_server/workflow_release.go \
            golang/cluster_controller/cluster_controller_server/placement_grants.go \
            golang/cluster_controller/cluster_controller_server/placement_grants_test.go \
            golang/cluster_controller/cluster_controller_server/handlers_status.go \
            golang/cluster_controller/cluster_controller_server/placement_generation_test.go \
            golang/cluster_controller/cluster_controller_server/handlers_status_grant_reject_test.go

      - name: Verify bounded fixes
        working-directory: services/golang
        run: |
          set -euo pipefail
          bash build/gen-version.sh 0.0.0-ci
          go test ./cluster_controller/cluster_controller_server -run 'Test(HasGrantIn|PlacementPredicate_ProfileUnionGrant|ApplyNodePlacementProfilesLocked|PlacementFreshnessEstablished|PlacementGenerationSurvivesRestart|NoDirectNodeProfilesMutationOutsideCanonicalPath|StatusAutoRegistrationEstablishesPlacementGeneration|ValidateServiceReleaseSpec_|WorkflowReleaseWritersUseCanonicalChokePoint)' -count=1

      - name: Commit fixes and remove one-shot automation
        working-directory: services
        run: |
          set -euo pipefail
          rm -f scripts/pr222-review-fixes.py scripts/pr222-review-fixes-v2.py .github/workflows/pr222-review-fixes.yml
          git config user.name "globulario-review-fix"
          git config user.email "noreply@globular.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: close PR 222 placement review gaps"
          git push origin HEAD:split/2-explicit-placement-contract
