name: PR 221 review fixes

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

env:
  GOWORK: "off"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: github.event.pull_request.number == 221 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout services branch
        uses: actions/checkout@v4
        with:
          path: services
          ref: split/1-package-identity-and-durability
          fetch-depth: 1

      - name: Checkout packages authority
        uses: actions/checkout@v4
        with:
          repository: globulario/packages
          path: packages

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Apply asserted source transformations
        working-directory: services
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pr221-review-fixes.py scripts/pr221-review-fixes-v2.py
          python3 scripts/pr221-review-fixes-v2.py
          gofmt -w golang/substrate/restore.go golang/substrate/substrate_test.go golang/globularcli/substrate_cmds.go

      - name: Verify bounded fixes
        working-directory: services
        run: |
          set -euo pipefail
          bash scripts/check-identity-authority.sh
          cd golang
          go test ./substrate

      - name: Commit fixes and remove one-shot automation
        working-directory: services
        run: |
          set -euo pipefail
          rm -f scripts/pr221-review-fixes.py scripts/pr221-review-fixes-v2.py .github/workflows/pr221-review-fixes.yml
          git config user.name "globulario-review-fix"
          git config user.email "noreply@globular.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: close PR 221 authority and recovery review gaps"
          git push origin HEAD:split/1-package-identity-and-durability
