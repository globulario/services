name: PR 221 review fixes

on:
  push:
    branches:
      - split/1-package-identity-and-durability
    paths:
      - scripts/pr221-review-fixes.py
      - .github/workflows/pr221-review-fixes.yml

permissions:
  contents: write

env:
  GOWORK: "off"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout services branch
        uses: actions/checkout@v4
        with:
          path: services
          ref: split/1-package-identity-and-durability
          fetch-depth: 0

      - name: Checkout packages authority
        uses: actions/checkout@v4
        with:
          repository: globulario/packages
          path: packages

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Apply asserted source transformations
        working-directory: services
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pr221-review-fixes.py
          python3 scripts/pr221-review-fixes.py
          gofmt -w golang/substrate/restore.go golang/substrate/substrate_test.go golang/globularcli/substrate_cmds.go

      - name: Verify bounded fixes
        working-directory: services
        run: |
          set -euo pipefail
          bash scripts/check-identity-authority.sh
          cd golang
          go test ./substrate

      - name: Commit fixes and remove one-shot automation
        working-directory: services
        run: |
          set -euo pipefail
          rm -f scripts/pr221-review-fixes.py .github/workflows/pr221-review-fixes.yml
          git config user.name "globulario-review-fix"
          git config user.email "noreply@globular.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: close PR 221 authority and recovery review gaps"
          git push origin HEAD:split/1-package-identity-and-durability
