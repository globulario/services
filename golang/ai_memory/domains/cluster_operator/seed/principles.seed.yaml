# cluster_operator seed principles — authored as PROPOSED, never auto-promoted.
# Each is generative (recommended_action) and pairs forbidden moves with the safe
# behavior to prefer. source_refs / generated_from trace lineage for PR-5A.
- id: principle.cluster.no_recovery_claim_without_authoritative_evidence
  title: No recovery claim without authoritative evidence
  applies_when:
    - condition.cluster.service.desired_observed_mismatch
  authorities:
    - authority.cluster.owner_service.runtime_state
  required_evidence:
    - evidence.cluster.owner_service.desired_state
    - evidence.cluster.owner_service.observed_state
  forbidden_moves:
    - forbidden.cluster.claim_recovery_without_authoritative_evidence
  recommended_action: >-
    Before claiming recovery, compare desired state and observed runtime state through
    the owner authority and summarize the remaining mismatch if any.
  risk_level: high
  revocation_rule: narrow if the owner-service desired/observed contract changes
  promotion_reason: repeated false-recovery incidents where a command success was mistaken for recovery
  source_refs:
    - seed:operational-knowledge/incidents
  generated_from:
    - opsknowledge:service-roles
    - opsknowledge:incidents
- id: principle.cluster.preserve_quorum_before_restart_under_etcd_pressure
  title: Preserve quorum before restart under etcd pressure
  applies_when:
    - condition.cluster.etcd.nospace_alarm
  authorities:
    - authority.cluster.etcd.member_health
  required_evidence:
    - evidence.cluster.etcd.alarm_status
    - evidence.cluster.etcd.member_health
    - evidence.cluster.etcd.compaction_state
  forbidden_moves:
    - forbidden.cluster.restart_before_quorum_check
  recommended_action: >-
    When etcd reports pressure, first establish member health, alarm state, and
    compaction/defrag safety before restarting dependent services.
  risk_level: irreversible
  revocation_rule: narrow if a newer etcd version changes NOSPACE/alarm semantics
  promotion_reason: blind restarts under etcd pressure have cascaded into quorum loss
  source_refs:
    - seed:operational-knowledge/runbooks
  generated_from:
    - opsknowledge:runbooks
- id: principle.cluster.preserve_owner_executor_boundary
  title: Preserve owner/executor boundary
  applies_when:
    - condition.cluster.service.desired_observed_mismatch
  authorities:
    - authority.cluster.owner_service.runtime_state
  required_evidence: []
  forbidden_moves:
    - forbidden.cluster.controller_executes_local_mutation
    - forbidden.cluster.direct_runtime_mutation_without_owner_authority
  recommended_action: >-
    Keep decision authority and execution authority separate: controllers decide desired
    state, workflow coordinates, node-local executors mutate local runtime.
  risk_level: high
  revocation_rule: narrow if the decide/coordinate/execute topology changes
  promotion_reason: repair attempts that moved execution into controllers damaged the architecture
  source_refs:
    - seed:operational-knowledge/service-roles
  generated_from:
    - opsknowledge:service-roles
- id: principle.cluster.treat_minio_topology_as_stateful_authority
  title: Treat MinIO topology as stateful authority
  applies_when:
    - condition.cluster.minio.pool_degraded
  authorities:
    - authority.cluster.minio.pool_health
  required_evidence:
    - evidence.cluster.minio.pool_health
  forbidden_moves:
    - forbidden.cluster.minio_topology_change_without_pool_authority
  recommended_action: >-
    For objectstore topology changes, reason from pool health, format/topology authority,
    and convergence evidence before restart or topology mutation.
  risk_level: irreversible
  revocation_rule: narrow if MinIO erasure/format model changes
  promotion_reason: drive-count changes without pool authority triggered silent reformat
  source_refs:
    - seed:operational-knowledge/runbooks
  generated_from:
    - opsknowledge:runbooks
    - opsknowledge:incidents
- id: principle.cluster.no_raw_owner_owned_state_write
  title: Never raw-write owner-owned state; route through the owner path
  applies_when:
    - condition.always
    - condition.cluster.owner_owned_state_write_intended
  authorities:
    - authority.cluster.owner_service.runtime_state
  required_evidence: []
  forbidden_moves:
    - forbidden.cluster.raw_owner_owned_state_write
  recommended_action: >-
    To change owner-owned desired/spec/status state, call the owning controller's typed RPC so
    the generation bumps, reconcile is triggered, and the resolved projection refreshes; never
    etcdctl-put, mcp-raw-write, or --force a cross-kind desired record. Raw etcd is read-only
    diagnostics or an explicit, human-confirmed, post-reconciled break-glass — never a normal
    repair path.
  risk_level: irreversible
  revocation_rule: narrow only if a sanctioned owner-mediated raw path is added that still bumps generation and reconciles
  promotion_reason: a raw infra-version / cross-kind desired write bypassed the owner path and produced a stale resolved projection and permanently unconvergeable drift; this is the gap the Governed Operation Gateway exists to close
  source_refs:
    - seed:operational-knowledge/incidents
  generated_from:
    - opsknowledge:incidents
    - opsknowledge:service-roles
- id: principle.cluster.deploy_through_release_pipeline_never_hot_swap
  title: Deploy through the release pipeline, never hot-swap a binary
  applies_when:
    - condition.always
    - condition.cluster.service.binary_update_intended
  authorities:
    - authority.cluster.release_pipeline.deployed_identity
  required_evidence: []
  forbidden_moves:
    - forbidden.cluster.hot_swap_binary_outside_release_pipeline
  recommended_action: >-
    To change what a service runs, go through the release pipeline (globular deploy /
    package_build + package_publish + reconcile) so version and checksum stay coherent
    across the 4-layer model; never cp-swap or hot-deploy a locally-built binary.
  risk_level: high
  revocation_rule: narrow if the deploy pipeline gains a sanctioned in-place replacement path that preserves version+checksum identity
  promotion_reason: hot-swapping locally-built binaries caused version/checksum drift, broken leader election, and permanent /proc drift; this is the most repeated deploy-time scar
  source_refs:
    - seed:operational-knowledge/incidents
  generated_from:
    - opsknowledge:incidents
    - opsknowledge:package-anti-patterns
# ── governed remediation (commit 5) ─────────────────────────────────────────
# The FIRST principle that gates a real doctor remediation through CheckAction.
# Deliberately narrow: one action kind, one invariant, one entity shape. It
# authorizes restarting a drifted Globular unit and nothing else — there is no
# principle here saying "the doctor may repair things".
#
# It requires only PRE-action evidence. Requiring fresh convergence verification
# would be circular: that evidence only exists after the action it would have to
# authorize.
- id: principle.cluster.restart_drifted_unit_with_observed_finding
  title: Restart a drifted Globular unit only on an observed doctor finding
  applies_when:
    - condition.cluster.node.systemd_unit_not_running
  authorities:
    - authority.cluster.owner_service.runtime_state
  required_evidence:
    - evidence.doctor.finding_observed
  forbidden_moves:
    - forbidden.cluster.restart_before_quorum_check
    - forbidden.cluster.controller_executes_local_mutation
  recommended_action: >-
    Restart the unit named by the finding, on the node named by the finding, only while a
    current cluster-doctor finding for node.systemd.units_running is observed for that exact
    node/unit — then re-run the doctor and confirm the finding cleared before reporting success.
  risk_level: low
  revocation_rule: >-
    revoke if SYSTEMCTL_RESTART stops being idempotent for globular-* units, or if the executor's
    unit allowlist is widened beyond Globular-managed units
  promotion_reason: >-
    restarting a drifted managed unit is deterministic, idempotent and reversible, and the
    executor already constrains it to the globular-* allowlist — it is the smallest real
    remediation that can be governed end to end
  source_refs:
    - seed:cluster-doctor/rules/node_units_running.go
  generated_from:
    - doctorrule:node.systemd.units_running
    - doctoraction:SYSTEMCTL_RESTART
# ── destructive Scylla recovery boundary ────────────────────────────────────
- id: principle.cluster.no_raw_scylla_data_wipe
  title: Never raw-wipe Scylla data outside controller-governed join recovery
  applies_when:
    - condition.always
  authorities:
    - authority.cluster.owner_service.runtime_state
    - authority.cluster.human.irreversible_ops
  required_evidence: []
  forbidden_moves:
    - forbidden.cluster.raw_scylla_data_wipe
  recommended_action: >-
    Treat a Scylla data wipe as a controller-governed join-recovery operation, never as a
    free-standing node repair. The controller may reach the node-agent wipe executor only after
    restart recovery failed and its authoritative node state proves ScyllaWasEverVerified=false.
    If the node has ever been verified in the ring, preserve the data and use a non-destructive
    recovery path.
  risk_level: irreversible
  revocation_rule: >-
    revoke or narrow only if the destructive executor itself gains an authority-preserving guard
    that proves the same never-verified precondition independently of caller assertions
  promotion_reason: >-
    the existing awareness invariant scylla.join_wipe_safe_only_if_never_verified already proves
    that a direct wipe bypasses the controller-side ScyllaWasEverVerified safety boundary; a raw
    wipe of a previously verified member can destroy live replicas and require full cluster restore
  source_refs:
    - awareness:scylla.join_wipe_safe_only_if_never_verified
    - source:golang/cluster_controller/cluster_controller_server/scylla_members.go
    - source:golang/node_agent/node_agent_server/grpc_scylla_wipe.go
  generated_from:
    - awareness:scylla.join_wipe_safe_only_if_never_verified
