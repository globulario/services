# cluster_operator required-evidence catalog.
# Each entry maps to a runtime probe (probe_ref). PR-5 records the spec only —
# probe EXECUTION stays explicit and outside the runtime hot path (see
# evidence_probes.go). The gate evaluates already-recorded / declared evidence.
- id: evidence.cluster.etcd.alarm_status
  title: etcd alarm status
  lane: runtime_required
  probe_ref: etcd.alarm_status
- id: evidence.cluster.etcd.member_health
  title: etcd member health
  lane: runtime_required
  probe_ref: etcd.member_health
- id: evidence.cluster.etcd.compaction_state
  title: etcd compaction / defrag safety state
  lane: runtime_required
  probe_ref: etcd.compaction_state
- id: evidence.cluster.scylla.schema_agreement
  title: ScyllaDB schema agreement
  lane: runtime_required
  probe_ref: scylla.schema_agreement
- id: evidence.cluster.minio.pool_health
  title: MinIO pool health
  lane: runtime_required
  probe_ref: minio.pool_health
- id: evidence.cluster.envoy.route_config
  title: Envoy route config presence
  lane: runtime_required
  probe_ref: envoy.route_config
- id: evidence.cluster.owner_service.desired_state
  title: Owner-service desired state
  lane: runtime_required
  probe_ref: owner_service.desired_state
- id: evidence.cluster.owner_service.observed_state
  title: Owner-service observed runtime state
  lane: runtime_required
  probe_ref: owner_service.observed_state
- id: evidence.cluster.human.irreversible_approval
  title: Human approval for an irreversible operation
  lane: static_only
  probe_ref: human.irreversible_approval

# PUSH-SOURCED REQUIREMENTS (no probe_ref)
#
# Every entry above is PULL-shaped: a probe the gate could in principle run to
# gather the evidence. The two below are PUSH-shaped — the evidence is emitted
# by a producer pipeline as a side effect of work the cluster was already
# doing, and is then looked up from the satisfaction index.
#
# probe_ref is deliberately absent rather than filled with a plausible name.
# There is no prober for these and inventing a ref would put a probe id in the
# catalog that nothing can execute — a spec that reads as a capability the
# system does not have. Their eligibility rules live in satisfaction.go, keyed
# to the emitting producer.
- id: evidence.doctor.finding_observed
  title: Cluster-doctor observed a finding for this invariant and entity
  lane: runtime_required
  # Producer: observation.FromDoctorFinding → sat.doctor.finding_observed
- id: evidence.remediation.fresh_convergence_verification
  title: Post-action verification that the governed finding cleared
  lane: runtime_required
  # Producer: observation.FromRemediationOutcome → sat.remediation.fresh_convergence_verified
