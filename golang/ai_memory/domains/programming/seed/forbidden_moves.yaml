# programming forbidden-move catalog.
# MANDATORY: every forbidden move carries a paired generative `recommended_behavior`
# (and where useful a safe_next_step) — negative-only rules are not allowed.
- id: forbidden.prog.merge_without_passing_tests
  title: Merge / deploy a change while its tests fail or are absent
  reason: a red or untested change entering a shared environment breaks the runtime for everyone
  recommended_behavior: Make the covering tests pass (or add them) before merge; if truly untestable, get maintainer authority on record.
  safe_next_step: gather evidence.prog.tests_pass, or resolve authority.prog.maintainer.codeowner
  action_aliases: merge_without_passing_tests, deploy_without_passing_tests, merge_red_change, deploy_red_change, merge_untested_change, deploy_untested_change
- id: forbidden.prog.break_public_contract_without_version_bump
  title: Change a published interface without a compatible version bump
  reason: silently breaking a contract breaks every downstream consumer that trusted the spec
  recommended_behavior: Keep the contract backward-compatible, or bump the version and record the migration path.
  safe_next_step: gather evidence.prog.contract_compat_checked against authority.prog.contract.api_spec
  action_aliases: break_public_contract, change_public_api_without_version_bump, remove_public_api_without_version_bump, incompatible_api_change_without_version_bump
- id: forbidden.prog.destructive_migration_without_backup
  title: Run a destructive schema/data migration without a verified backup
  reason: a failed destructive migration with no backup is unrecoverable data loss
  recommended_behavior: Verify a restorable backup exists first; prefer expand-then-contract (additive) migrations.
  safe_next_step: gather evidence.prog.backup_verified before applying the migration
  action_aliases: destructive_migration_without_backup, drop_schema_without_backup, truncate_without_backup, rewrite_data_without_backup
- id: forbidden.prog.trust_forum_over_spec
  title: Follow a forum/blog answer that contradicts the authoritative spec
  reason: community lore is a weak signal; acting on it over the contract propagates plausible-but-wrong behavior
  recommended_behavior: Verify the claim against the spec, the tests, or the runtime before acting on it.
  safe_next_step: resolve authority.prog.contract.api_spec (or reproduce against runtime) before trusting the forum claim
  action_aliases: trust_forum_over_spec, follow_forum_over_spec, override_spec_with_forum_answer
- id: forbidden.prog.suppress_failing_test_to_go_green
  title: Skip, delete, or weaken a failing test to make the suite pass
  reason: silencing the test destroys the very evidence that would reveal the regression
  recommended_behavior: Fix the code the test protects, or — with maintainer authority — narrow the test with a recorded reason.
  safe_next_step: resolve authority.prog.maintainer.codeowner before altering test intent
  action_aliases: skip_failing_test, delete_failing_test, disable_failing_test, weaken_failing_test, weaken_test_assertion_to_pass, mark_failing_test_skipped
- id: forbidden.prog.commit_secret_in_source
  title: Commit a credential, key, or secret into source or config
  reason: secrets in history are effectively permanently leaked and hard to fully revoke
  recommended_behavior: Move the secret to the secret store / env injection and reference it; rotate any value already exposed.
  safe_next_step: remove the value from the diff and wire it through the secret path before committing
  action_aliases: commit_secret, write_secret_to_source, add_credential_to_source, add_credential_to_config, commit_api_key, commit_private_key
- id: forbidden.prog.diagnose_from_aggregate_alone
  title: Build a causal theory from a count, total or status field alone
  reason: an aggregate says THAT something is wrong and is almost silent on WHY; a theory built on one is unfalsifiable and sends the investigation somewhere plausible and wrong
  recommended_behavior: Go to one concrete artifact that can be checked mechanically — the record for the single stuck item, the log line naming the entity, a value that can be recomputed — and prefer the artifact that can falsify the theory in one step.
  safe_next_step: gather evidence.prog.artifact_level_observation before naming a cause
  action_aliases: diagnose_from_count, conclude_from_status_field, infer_cause_from_totals, root_cause_from_aggregate
- id: forbidden.prog.claim_fix_without_confirming_path_executed
  title: Attribute an improvement to a fix without confirming the fixed path ran
  reason: a green measurement after a deploy is equally consistent with the fix working, the fix being inert, and unrelated timing; only one of those is a fix
  recommended_behavior: Confirm the new code path actually executed — a log line it emits, a counter, a state only it can produce — before attributing any improvement to it.
  safe_next_step: gather evidence.prog.fixed_path_executed
  action_aliases: claim_fix_works, attribute_improvement_to_fix, declare_fixed_after_deploy
- id: forbidden.prog.widen_budget_to_hide_flake
  title: Raise a timeout or retry budget to stabilise an intermittent failure
  reason: widening a window converts a visible failure into a rarer one and destroys the signal that was pointing at a real defect
  recommended_behavior: Explain the mechanism first. Aligning a wait with the predicate actually asserted is legitimate; enlarging it so red turns green is not. Calibrate a budget only once a mechanism is known and is genuinely a scheduling mismatch.
  safe_next_step: gather evidence.prog.flake_mechanism_explained
  action_aliases: increase_timeout_for_flaky_test, raise_retry_budget, extend_settle_window, bump_timeout_to_pass
