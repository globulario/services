# programming seed principles — authored as PROPOSED, never auto-promoted.
# Each is generative (recommended_action) and pairs forbidden moves with the safe
# behavior to prefer. Every ref below must resolve within this pack's catalogs.
# condition.always gives forbidden-move matching universal reach without engaging
# the principle for unrelated actions; the runtime engages an always principle
# only when one of its forbidden moves matches (or another declared condition does).
- id: principle.prog.no_deploy_without_passing_tests
  title: No deploy to a shared environment without passing tests
  applies_when:
    - condition.always
    - condition.prog.deploy_to_production
  authorities:
    - authority.prog.test.passing_suite
  required_evidence:
    - evidence.prog.tests_pass
  forbidden_moves:
    - forbidden.prog.merge_without_passing_tests
    - forbidden.prog.suppress_failing_test_to_go_green
  recommended_action: >-
    Before deploying to a shared environment, require the change's covering tests to be
    green; if a path is genuinely untestable, record explicit maintainer authority instead.
    Never silence a failing test to manufacture a green result.
  risk_level: high
  revocation_rule: narrow if the deploy target is a throwaway/isolated sandbox no one depends on
  promotion_reason: repeated breakage from changes merged red or without covering tests
  source_refs:
    - seed:programming/ci-incidents
- id: principle.prog.preserve_public_contract
  title: Preserve the published contract or bump the version
  applies_when:
    - condition.always
    - condition.prog.public_api_change
  authorities:
    - authority.prog.contract.api_spec
  required_evidence:
    - evidence.prog.contract_compat_checked
  forbidden_moves:
    - forbidden.prog.break_public_contract_without_version_bump
  recommended_action: >-
    Treat the published spec as the authority: keep changes backward-compatible, or bump
    the version and record the migration path for downstream consumers.
  risk_level: high
  revocation_rule: narrow if the interface has no consumers and is explicitly marked internal/unstable
  promotion_reason: downstream breakage caused by silent contract changes without a version bump
  source_refs:
    - seed:programming/contract-breakage
- id: principle.prog.backup_before_destructive_migration
  title: Verify a backup before any destructive data migration
  applies_when:
    - condition.always
    - condition.prog.schema_migration
    - condition.prog.destructive_data_op
  authorities:
    - authority.prog.runtime.truth_plane
  required_evidence:
    - evidence.prog.backup_verified
  forbidden_moves:
    - forbidden.prog.destructive_migration_without_backup
  recommended_action: >-
    Before a destructive migration, verify a restorable backup exists; prefer additive
    expand-then-contract migrations over in-place destructive rewrites.
  risk_level: irreversible
  revocation_rule: revoke only if the store is provably reconstructible from an authoritative upstream
  promotion_reason: unrecoverable data loss from destructive migrations run without a verified backup
  source_refs:
    - seed:programming/migration-incidents
- id: principle.prog.spec_over_forum
  title: Trust the spec and the runtime over community lore
  applies_when:
    - condition.always
    - condition.prog.public_api_change
  authorities:
    - authority.prog.contract.api_spec
  required_evidence: []
  forbidden_moves:
    - forbidden.prog.trust_forum_over_spec
  recommended_action: >-
    When a forum/blog answer conflicts with the authoritative spec or the observed runtime,
    verify against the spec, the tests, or the running system before acting.
  risk_level: low
  revocation_rule: narrow if no authoritative spec exists and the community answer is the only reference
  promotion_reason: plausible-but-wrong behavior propagated by trusting forum answers over the contract
  source_refs:
    - seed:programming/authority-inversion
- id: principle.prog.never_commit_secret
  title: Never commit credentials or private key material to source control
  applies_when:
    - condition.always
  authorities:
    - authority.prog.maintainer.codeowner
  required_evidence: []
  forbidden_moves:
    - forbidden.prog.commit_secret_in_source
  recommended_action: >-
    Remove credentials, API keys, tokens, and private key material from the diff before commit;
    inject them through the repository's approved secret path and rotate any value that has
    already entered version history.
  risk_level: irreversible
  revocation_rule: revoke only if the repository stops being persistent/shareable history and the referenced material is provably non-secret test data
  promotion_reason: a secret committed to version history is effectively leaked and difficult to erase completely; prevention must have universal reach
  source_refs:
    - seed:programming/security-boundary
- id: principle.prog.diagnose_from_an_artifact_not_an_aggregate
  title: Diagnose from a single artifact, not from an aggregate
  applies_when:
    - condition.always
    - condition.prog.diagnosing_a_failure
  authorities:
    - authority.prog.runtime.truth_plane
  required_evidence:
    - evidence.prog.artifact_level_observation
  forbidden_moves:
    - forbidden.prog.diagnose_from_aggregate_alone
  recommended_action: >-
    When a count, status field or audit total looks wrong, do not form a causal theory
    from it. Go to one concrete artifact that can be checked mechanically — the record
    for the single stuck item, the log line naming the entity, a value that can be
    recomputed — and prefer the artifact that can falsify the theory in one step.
  risk_level: low
  revocation_rule: narrow if the artifact is genuinely unavailable and waiting for it blocks work an aggregate could safely unblock
  promotion_reason: >-
    Five successive wrong diagnoses in one campaign, each reasoned from an aggregate,
    each corrected by one artifact. "23 succeeded / 1 pending" produced three different
    wrong causes; the release record showing every node AVAILABLE while the release was
    DEFERRED settled it immediately. A phantom node id looked like etcd corruption until
    nodeid.FromMAC("02:42:0a:0a:00:0c") was computed and matched it exactly.
  source_refs:
    - seed:programming/simulation-campaign-2026-08
- id: principle.prog.confirm_the_fixed_path_executed
  title: Confirm the fixed path executed before claiming a fix works
  applies_when:
    - condition.always
    - condition.prog.verifying_a_fix
  authorities:
    - authority.prog.runtime.truth_plane
  required_evidence:
    - evidence.prog.fixed_path_executed
  forbidden_moves:
    - forbidden.prog.claim_fix_without_confirming_path_executed
  recommended_action: >-
    After deploying a fix, verify the new path ran — a log line it emits, a counter, a
    state only it produces — before attributing any improvement to it. A green
    measurement after a deploy is equally consistent with the fix working, the fix being
    inert, and unrelated timing.
  risk_level: low
  revocation_rule: narrow for changes with no observable executable branch, such as a pure deletion
  promotion_reason: >-
    A release-finalize fix was announced as "the livelock is gone, direct proof: 24/24".
    The measurement was real; the attribution was not. The running controller showed 20
    DEFERRED finalizations and ZERO hits on the new path — the fix was inert on that
    cluster and something else explained the result. One grep for the emitted string
    would have caught it before the claim was made.
  source_refs:
    - seed:programming/simulation-campaign-2026-08
- id: principle.prog.explain_a_flake_before_widening_a_budget
  title: A flaky result is a symptom to explain, not a budget to widen
  applies_when:
    - condition.always
    - condition.prog.intermittent_result
  authorities:
    - authority.prog.runtime.truth_plane
  required_evidence:
    - evidence.prog.flake_mechanism_explained
  forbidden_moves:
    - forbidden.prog.widen_budget_to_hide_flake
  recommended_action: >-
    When a check passes and fails across identical code, explain the mechanism before
    touching timeouts. Aligning a wait with the predicate actually asserted is
    legitimate; enlarging it so red turns green is not.
  risk_level: low
  revocation_rule: revoke once a mechanism is identified AND is genuinely a scheduling mismatch with no underlying defect, where calibrating the budget is the correct fix
  promotion_reason: >-
    A scenario gave PASS, FAIL, FAIL, FAIL, PASS over identical code and was nearly
    written off as test-design flakiness. The mechanism turned out to be a real
    control-plane defect: a ghost node in a release's node list made that release
    permanently unconvergeable, so a cluster-wide audit could never be clean. Widening
    the budget would have buried the bug as noise.
  source_refs:
    - seed:programming/simulation-campaign-2026-08
