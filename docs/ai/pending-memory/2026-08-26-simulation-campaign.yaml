# Staged ai-memory + behavioral-memory entries — REPLAY WHEN THE CLUSTER IS BACK.
#
# Written 2026-08-26 during the 1.2.328 -> 1.2.338 quickstart simulation campaign.
# ai-memory and behavioral-memory were unreachable for the whole campaign
# (mcp__globular__* returned "Unable to connect"): those services run on the real
# cluster, and the sim had the machine. The awareness graph WAS reachable and
# already carries the code-level scars (sensei propose, 13 entries) — what is
# staged here is the OPERATIONAL knowledge and the BEHAVIORAL lesson, which are
# the two rungs of the coherence loop that could not be written.
#
# Replay: for each memory_entries item call mcp__globular__memory_store; for each
# behavioral item call mcp__globular__behavioral_propose_principle. Nothing here
# is promoted — promotion stays an explicit human decision.

memory_entries:
  - project: globular-services
    type: debug
    title: "Phantom node after a restart storm — recompute the id before assuming corruption"
    tags: "ops.diagnose.phantom-node,identity,restart-storm,always"
    content: |
      SYMPTOM: `globular cluster nodes list` reports N+1 nodes; a scenario asserting
      node count fails with "expected 5, got 6". The extra id has records under
      /globular/nodes/ but appears in NO node's journal.

      DIAGNOSIS — do this before suspecting etcd corruption or a rogue host. The id
      is a UUIDv5 derived from a real basis, so it can be RECOMPUTED and attributed:

        nodeid.FromMAC(<mac>)                     # MAC basis
        nodeid.FromHostAndIPs(<hostname>, <ips>)  # fallback basis

      Observed 2026-08-26: phantom b68457f5-bfb6-5452-bccc-cc36f29d1bbc equalled
      nodeid.FromMAC("02:42:0a:0a:00:0c"), and /sys/class/net/eth0/address on
      globular-node-2 was exactly that. The phantom was node-2 under a SECOND
      identity — not a foreign machine.

      CAUSE: the identity basis is not time-invariant. identity.StableNodeID prefers
      IdentityBasisMAC() (sync.Once, so stable within a process, re-decided on every
      restart) and falls back to hostname+sorted-IPs. SelectBestMAC requires an
      interface that is up WITH a routable IP, so an agent restarting before its
      interface is ready derives the hostname id, and after it is ready derives the
      MAC id. A restart storm flips the answer and the machine is admitted twice.

      Note isPhysicalInterface filters on interface NAME (veth, docker, br-, ...).
      A container's eth0 is named like a physical NIC and carries a Docker-assigned
      MAC, so it is NOT filtered. Do not "fix" this by adding a name prefix or by
      matching the 02:42 MAC prefix — see the forbidden_fix in the awareness graph.

      COST: a phantom in a release's node list makes that release permanently
      unconvergeable. See ops.diagnose.release-churn.

  - project: globular-services
    type: debug
    title: "A ServiceRelease that never settles — check its node list against real membership"
    tags: "ops.diagnose.release-churn,release,drift,always"
    content: |
      SYMPTOM: the release audit never reaches failed:0. One ServiceRelease cycles
      AVAILABLE -> RESOLVED -> FAILED -> PENDING indefinitely. Observed: `persistence`
      logged 75 phase transitions in a ten-minute window with nothing else running.

      DIAGNOSIS: read the release record's status.nodes and compare each node_id
      against actual cluster membership.

        etcdctl get /globular/resources/ServiceRelease/<pub>/<svc> --print-value-only

      The signature of THIS bug is a release whose recorded nodes are all AVAILABLE
      (or which names a node absent from `cluster nodes list`) while the release
      itself is FAILED. detectServiceDrift resolved each recorded node against
      srv.state.Nodes; a miss meant every version/health probe read a nil node and
      failed, so the release was marked DEGRADED -> FAILED -> PENDING forever. The
      verdict is unfalsifiable — nothing about a node that does not exist changes.

      Fixed in services 6013811b (ghost entries are skipped and pruned). If it
      recurs, the upstream cause is a phantom node — see ops.diagnose.phantom-node.

  - project: globular-services
    type: architecture
    title: "Release phases: transient FAILED is normal, permanent FAILED is a bug — 5 minute self-heal"
    tags: "ops.release.self-heal,release,always"
    content: |
      A release going FAILED during ordinary install/upgrade/join activity is NORMAL
      and self-heals. Both ServiceRelease and InfrastructureRelease reconcilers carry
      a self-heal path:

        "<name>: FAILED -> PENDING (all nodes converged, clearing failure)"
        reason = self_healed_converged

      It fires after releaseRetryBackoff = 5 minutes, then PENDING -> RESOLVED ->
      AVAILABLE. So a cluster-wide `failed: 0` assertion sampled sooner than that,
      or while scenarios keep creating work, will see non-zero and be RIGHT to.

      OPERATIONAL RULE: do not escalate on a FAILED release until you have given it
      one backoff plus a workflow round-trip. Escalate only if it is still FAILED
      after that — that is the ghost-node signature, not slowness. Measured: a
      cluster left alone after a destructive suite went 22 succeeded / 2 failed ->
      24/24 in 3 minutes unaided.

      DEFERRED is NOT terminal either: release_phase.go defines DEFERRED -> PENDING
      as "retry target selection after backoff", with no attempt ceiling.

  - project: globular-services
    type: architecture
    title: "MinIO is a commodity tier — three places it used to block convergence"
    tags: "ops.minio.not-a-pillar,minio,convergence,always"
    content: |
      invariant minio.is_commodity_not_a_pillar says MinIO must not gate a primary
      service's health nor block node convergence. Three sites violated it and were
      fixed 2026-08-25:

      1. bootstrap storage_joining (services cfa922ae) — MinIO not reaching
         verified/non_member FAILED the node's bootstrap. An object-store problem
         became a refusal of cluster membership. Now: ScyllaDB still blocks (it is a
         pillar holding cluster state and the workflow lease table); MinIO degrades.
      2. the bootstrap workflow's storage_verified condition (services 4ecf082c) —
         same demand one layer up; maybe_wait_storage gates mark_workload_ready and
         onFailure marks the node failed, so it would have overridden fix 1. Both
         gates now derive from one predicate, storageGateSatisfied.
      3. the drift reconciler's node gate (services d7600fdd) — node.Status includes
         MinIO, and reconciler.go skipped any node not "ready", so a MinIO outage on
         a pool member froze convergence for EVERY unrelated service on that node.
         Node health still reports MinIO honestly; only the convergence gate stopped
         obeying it.

      OPERATIONAL RULE: if node convergence or bootstrap stalls, MinIO should no
      longer be the cause. If it appears to be, that is a regression worth reporting.

  - project: globular-services
    type: debug
    title: "Infra health probes go THROUGH the node agent — unreachable is not unhealthy"
    tags: "ops.diagnose.infra-probe,etcd,scylladb,minio,always"
    content: |
      Every infra health probe (probe-etcd-health, probe-scylla-health,
      probe-minio-health) is executed BY the node agent: the controller dials the
      agent and asks it to run the probe locally. So an unreachable agent tells you
      NOTHING about etcd/scylla/minio on that node.

      Before services c3a3a317 the probe returned a bare bool, so a dial failure, an
      RPC timeout and an empty endpoint were indistinguishable from "the component is
      unhealthy". Live signature of the resulting latch:

        remediation not resolved for etcd@<node> (infra_unhealthy)
          — child_status=SUCCEEDED, no-progress 3/3
        item FAILED: type=infra_unhealthy ... reason=remediation_no_progress

      ...against an etcd that was fine. The resolution re-probe failed for the same
      reason the original probe did.

      Now three outcomes: healthy / unhealthy / unreachable. Only a definitive
      "unhealthy" raises drift or counts against a remediation; an unobservable
      outcome holds the drift open without charging a strike, bounded so it still
      reaches a terminal state.

  - project: globular-services
    type: debug
    title: "A node stuck at 'converging' may never escalate — the grace window cannot expire"
    tags: "ops.diagnose.node-status,health,known-issue,always"
    content: |
      KNOWN DEFECT (filed, not yet fixed as of 2026-08-26).

      evaluateNodeStatus escalates a node with missing/inactive required units from
      "converging" to "degraded" once statusGracePeriod (2 minutes) elapses — but it
      measures with time.Since(node.ReportedAt), and ReportedAt is refreshed by EVERY
      heartbeat (handlers_status.go). For any node still talking to the controller
      that value is seconds old, so the grace never expires and "degraded" is
      unreachable. A node whose units are permanently missing reports "converging"
      forever.

      OPERATIONAL RULE: do not read "converging" as "making progress". Check the unit
      list directly. Observed: node-4 and node-5 held "converging" 40+ minutes after
      all activity stopped, because their profiles legitimately cannot host some
      required units — a permanent condition displayed as a transient one.

  - project: globular-services
    type: reference
    title: "Scenario evidence bundles now capture the control-plane journal"
    tags: "ops.evidence.journal,quickstart,debugging,always"
    content: |
      quickstart 137790c added evidence_collect_journals. Bundles now contain:

        evidence/journal/<node>/cluster-controller.log
        evidence/journal/<node>/node-agent.log
        evidence/journal/<node>/workflow.log

      bounded by EVIDENCE_JOURNAL_SINCE (default -30 min) and EVIDENCE_JOURNAL_LINES
      (default 4000) — about 1 MB per node.

      WHY IT EXISTS: evidence_collect_systemd captures `systemctl status`, which
      retains ~10 journal lines. Twice in one session a failure could not be
      root-caused after the fact because the explaining line lived only in the live
      journal ("circuit OPEN" after a controller thaw; the release-workflow skip
      reason behind a DEFERRED release). READ THIS DIRECTORY FIRST when a scenario
      fails — the ghost-node bug was found in it within minutes of it existing.

  - project: globular-services
    type: decision
    title: "Open questions from the 1.2.338 campaign that need a human decision"
    tags: "ops.open-questions,placement,etcd,always"
    content: |
      Filed as contract_unknown in the awareness graph rather than guessed at:

      1. WHICH CATALOG IS THE PLACEMENT AUTHORITY. golang/service_catalog.yaml and
         cluster_controller/component_catalog.go disagree on profiles for 16 of 33
         shared services (e.g. ai-memory yaml=[compute core] vs
         go=[control-plane database scylla]). The controller dispatches from the Go
         catalog; specgen publishes the YAML one into package manifests, and the
         dynamic catalog built from those manifests OVERRIDES the static one. So
         effective placement depends on whether a repository load succeeded. Evidence
         the Go values are the semantically right ones: ai-memory was running on
         node-5 with Scylla inactive.
      2. MUST AN UNPLACEABLE RELEASE TERMINATE. DEFERRED retries every 2 minutes with
         no ceiling. release_phase.go already permits DEFERRED -> FAILED.
      3. WHO RESTORES ETCD MEMBERSHIP after an identity-clone attack. The controller
         is observe-only here BY DESIGN ("avoids dangerous controller-initiated
         MemberAdd"); a node that lost membership is marked EtcdJoinRejoinRequired
         and the operator is told to run repair-etcd. authority/node-clone-identity-
         collision asserts automatic recovery, so it fails a POSTCONDITION
         (etcd_member_count 5 -> 4) while every identity assertion passes.
      4. WHETHER service_catalog "dependencies" means install ordering or systemd
         After= ordering. It is currently rendered into After=, which would order
         node_agent after the etcd and cluster-controller it installs on Day-0.

behavioral_principle_candidates:
  - project: globular-services
    domain: programming
    title: "Diagnose from a single artifact, not from an aggregate"
    risk_level: low
    actor: claude-opus-5
    recommended_behavior: |
      When a count, status field or audit total looks wrong, do not form a causal
      theory from it. Aggregates say THAT something is wrong and are almost silent on
      WHY; every wrong theory in this campaign came from reasoning off one. Go to a
      single concrete artifact that can be checked mechanically: the record for the
      one stuck release, the journal line naming the node, a UUID that can be
      recomputed. Prefer an artifact that can FALSIFY the theory in one step.
    promotion_reason: |
      Five successive wrong diagnoses in one campaign, each from an aggregate, each
      corrected by one artifact. "23 succeeded / 1 pending" produced three different
      wrong causes; the release record showing every node AVAILABLE while the release
      was DEFERRED settled it immediately. A phantom node id looked like etcd
      corruption until nodeid.FromMAC("02:42:0a:0a:00:0c") was computed and matched
      it exactly. The pattern is strong enough and cheap enough to be a default.
    revocation_rule: |
      Revoke or narrow if artifact-level diagnosis starts costing materially more
      than the aggregate-level theories it replaces — e.g. when the only artifact is
      unavailable and waiting for it blocks work an aggregate could have unblocked.
    generated_from: "session:2026-08-26-simulation-campaign"

  - project: globular-services
    domain: programming
    title: "Confirm the fixed code path actually executed before claiming a fix works"
    risk_level: low
    actor: claude-opus-5
    recommended_behavior: |
      After deploying a fix, verify the NEW path ran — a log line it emits, a counter,
      a state only it produces — before attributing any improvement to it. A green
      measurement after a deploy is consistent with the fix working, with the fix
      being inert, and with unrelated timing. Those are different facts and only one
      of them is a fix.
    promotion_reason: |
      Claimed "the livelock is gone, direct proof: 24/24" after deploying a release
      finalize fix. The measurement was real; the attribution was not. The running
      controller showed 20 DEFERRED finalizations and ZERO hits on the new
      out-of-scope path — the fix was inert on that cluster and something else
      explained the result. A one-command check (grep the emitted string) would have
      caught it before the claim was made.
    revocation_rule: |
      Revoke if the emitted-evidence requirement becomes unsatisfiable for a class of
      fixes (e.g. a pure deletion with no observable path), in which case narrow it to
      fixes that add or change an executable branch.
    generated_from: "session:2026-08-26-simulation-campaign"

  - project: globular-services
    domain: programming
    title: "A flaky assertion is a symptom to explain, not a budget to widen"
    risk_level: low
    actor: claude-opus-5
    recommended_behavior: |
      When a test passes and fails across identical code, explain the mechanism
      before touching timeouts. Widening a window converts a visible failure into a
      rarer one and destroys the signal that was pointing at a real defect. Aligning a
      wait with the predicate actually asserted is legitimate; enlarging it to make
      red go green is not.
    promotion_reason: |
      rollback-guard-refuses-silent-regression gave PASS, FAIL, FAIL, FAIL, PASS over
      identical code. It was nearly written off as scenario-design flakiness and
      handed back as a design decision. The mechanism turned out to be a real
      control-plane bug: a ghost node in a release's node list made that release
      permanently unconvergeable, so a cluster-wide audit could never be clean. Had
      the budget been widened, the bug would have survived and looked like test noise.
    revocation_rule: |
      Revoke if a mechanism is found and IS genuinely a scheduling mismatch with no
      underlying defect — then calibrating the budget is the correct fix and this
      principle should not obstruct it.
    generated_from: "session:2026-08-26-simulation-campaign"
