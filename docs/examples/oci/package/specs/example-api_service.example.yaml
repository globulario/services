version: 1

metadata:
  name: example-api
  kind: service
  description: Reference OCI-backed HTTP service package
  entrypoint: none
  install_bins: false
  managed_unit: true
  systemd_unit: globular-example-api.service
  profiles:
    - oci-workload
  priority: 80
  hard_deps: []
  provides_capabilities:
    - example-api
  health_check:
    unit: globular-example-api.service
    port: 18080

service:
  name: example-api

steps:
  - id: install-package-payload
    type: install_package_payload
