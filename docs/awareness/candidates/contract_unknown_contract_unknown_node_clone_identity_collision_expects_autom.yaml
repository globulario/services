contract_unknown:
  - id: contract_unknown.node_clone_identity_collision_expects_automatic_etcd_re_add
    kind: contract_unknown
    title: node-clone-identity-collision expects automatic etcd re-add that the controller deliberately refuses
    description: 'The scenario stops a victim node, clones its identity onto an impostor, then cleans up by restoring the victim''s own state, starting it as itself, and waiting 240s for it to rejoin. Its postcondition requires the cluster to return to its captured state: etcd_member_count 5. It does not — the run ends at 4 members and 3 healthy endpoints. Every identity assertion in the scenario passes, including no_duplicate_identity_admitted and no_identity_findings, so identity handling is working; only etcd membership does not come back. That is by design. reconcileEtcdJoinPhases handles EtcdJoinNone and EtcdJoinFailed observe-only: ''the join script on the node handles MemberAdd directly. The controller just detects when a node has successfully joined... This avoids dangerous controller-initiated MemberAdd calls, especially during 1-to-2 expansion where quorum requires 2/2 members immediately.'' A node that lost its membership while away is classified EtcdJoinRejoinRequired and the operator is told to run ''globular node repair-etcd --wipe-local-etcd''. So the scenario asserts an automatic recovery the architecture deliberately withholds, and simply restarting the node cannot supply it.'
    revision_request: 'Decide which side moves. Either the scenario''s cleanup performs the operator-equivalent rejoin (repair-etcd) before asserting the postcondition, which keeps the safety boundary intact and still proves the cluster can be restored; or the controller gains a narrowly-scoped automatic re-add for a node that was previously a verified voter and is returning with its own identity — which must be weighed against etcd.auto_rejoin_leader_guard_fails_open, where a membership guard that failed open could have destroyed quorum. Do not resolve it by relaxing the postcondition: losing a member to an identity-clone attack and never noticing is exactly what the scenario exists to catch.'
    source_files:
      - golang/cluster_controller/cluster_controller_server/etcd_members.go
    evidence:
      - 'authority/node-clone-identity-collision, runs on 1.2.334 and 1.2.337: POSTCONDITION ''cluster did not return to its captured state within 120s: etcd_healthy_endpoints baseline=5 now=3; etcd_member_count baseline=5 now=4''. All twelve assertions PASS on both runs. etcd_members.go reconcileEtcdJoinPhases case EtcdJoinNone/EtcdJoinFailed is observe-only by explicit comment; the stuck branch sets EtcdJoinRejoinRequired with operator instructions rather than acting.'
