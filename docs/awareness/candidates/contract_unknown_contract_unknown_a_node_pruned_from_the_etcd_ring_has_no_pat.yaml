contract_unknown:
- id: contract_unknown.a_node_pruned_from_the_etcd_ring_has_no_path_back_the_config
  kind: contract_unknown
  title: 'WITHDRAWN (was: a node pruned from the etcd ring has no path back) — real cause is a 120s restoration window shorter than the repair cycle'
  description: 'WITHDRAWN AS FILED. The claim ''nothing performs the MemberAdd'' is false: the controller journal for authority/rejoin-after-missed-generations contains ''etcd auto-rejoin: MemberAdd succeeded for 35ac3821 (node-5) peerURL=https://10.10.0.15:2380'' at 22:41:01, followed by a wipe-etcd-and-rejoin that carried the rendered membership and brought node-5 back to serving. The original entry came from grepping ONE scenario bundle (node-clone-identity-collision), finding zero auto-rejoin lines, and generalising to the whole suite. REAL FINDING: globular-scenario''s _verify_postconditions polls for a hardcoded 120 seconds, while the controller''s auto-rejoin cycle takes several minutes (node-5 etcd deactivated 22:36:37, MemberAdd 22:41:01, wipe executed 22:44:24; the dispatch cooldown alone is 3 minutes). The scenario declares failure while a working repair is still in flight. The ring does return to 5 — during the NEXT scenario, which is why rejoin-after-missed-generations captured baseline=4 and then ''failed'' by healing to 5. Harness timing defect, not a product defect.'
  revision_request: 'Give the restoration gate a per-scenario window sized to the repair it waits on, instead of one 120s constant. Do NOT ''fix'' this by making renderEtcdConfig render for non-members, nor by auto-MemberAdd on any absent node — the graph records failure.the_stale_member_prune_evicts_a_live_etcd_voter_when_an_impostor_hijacks_its_node_record and invariant topology.reconciler_must_respect_safety_contract. Neither is implicated: the existing auto-rejoin path already does the right thing, it is simply slower than the assertion allows.'
  source_files:
  - tests/harness/bin/globular-scenario
  evidence:
  - 'authority/rejoin-after-missed-generations, 1.2.360 (tests/reports/20260903T213704-authority): ''etcd auto-rejoin: MemberAdd succeeded for 35ac3821-6b90-52eb-a800-41130471770b (node-5)'' at 22:41:01; node agent logs ''wipe-etcd-and-rejoin: set initial-cluster=node-4=...,node-5=...,node-2=...,node-3=...'', then ''wiped /var/lib/globular/etcd/member'' and ''completed successfully in 181ms'' at 22:44:24; node-5 etcd then logs ''published local member to cluster through raft'', ''ready to serve client requests'', ''serving client traffic securely'', with 0 occurrences of ''member count is unequal''. Ring returned to 5. node-clone-identity-collision ended 22:36:37, having already failed its 120s postcondition. On 1.2.359 the same wipe ran 4 times with NO ''set initial-cluster'' line and the node never returned.'
