contract_unknown:
  - id: contract_unknown.a_client_must_read_a_cluster_private_key_to_prove_it_is_a_cl
    kind: contract_unknown
    title: A client must read a cluster-private key to prove it is a cluster member
    description: After cluster initialization the server requires cluster_uid on any request that is not bootstrap, mTLS, JWT, loopback, or allowlisted (interceptors/ServerInterceptors.go). The client attaches it best-effort from security.GetLocalClusterUID, which reads the UUID through config.ReadClusterMembershipID, which needs an etcd client, which needs the cluster service keypair — because etcd runs with client-cert-auth true. So a caller that is not already privileged enough to read a cluster-private key cannot obtain the badge that proves it is a member, and its requests are refused. The loopback exemption hides this for local calls, so it presents as an intermittent fault whose rate is simply the fraction of discovery rotations that leave the node.
    revision_request: 'Decide the authorization boundary for repository artifact-metadata reads, then make the client''s inability to attach cluster_uid loud rather than silent. Candidates: (a) allowlist GetArtifactVersions if artifact metadata is not cluster-private — cheapest, but leaves the circularity for the next caller; (b) give unprivileged clients a lawful membership proof that does not require reading cluster-private material first — addresses the actual defect; (c) at minimum, have the client refuse to emit a request it knows will be refused, naming the missing badge. (c) is safe standalone; (a) and (b) change the security posture and need an owner''s decision.'
    source_files:
      - golang/globular_client/ClientInterceptors.go
    evidence:
      - '1.2.360 five-node simulation, 2026-09-03: upgrade/deploy-publish-then-converge PARTIAL. evidence.json records ''cannot verify the kind of dns (repository unreachable: rpc error: code = Unauthenticated desc = cluster_uid required after cluster initialization)''. On 1.2.359 the same condition was reported as ''the repository reported no published version with a resolvable kind — publish it, then retry'' for a package published and installed on all five nodes, at a rate of 2 of 15 calls; the true cause only became visible after the refusal began naming the RPC error it observed. The client''s own comment still asserts ''Nothing validates cluster_uid yet (Phase-2 dual-accept)'', which has been false since the server began enforcing it at two sites.'
