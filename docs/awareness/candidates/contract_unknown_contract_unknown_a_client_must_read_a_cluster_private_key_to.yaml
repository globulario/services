contract_unknown:
- id: contract_unknown.a_client_must_read_a_cluster_private_key_to_prove_it_is_a_cl
  kind: contract_unknown
  title: 'RESOLVED, and the premise was wrong: the CLI could obtain cluster_uid all along — it had no interceptor to attach it'
  description: 'RESOLVED. The original claim — that a client must read a cluster-private key to prove membership, an architectural circularity requiring an authorization-boundary decision — is FALSE. Verified against a live cluster: /globular/system/cluster/id is minted and readable, the endpoints file lists all five node IPs, and the CLI runs as root in the container with full read access to the service keypair. It could obtain the badge at any time. REAL CAUSE: globularcli built every gRPC connection with a raw grpc.DialContext carrying transport credentials and nothing else. There were ZERO interceptors in the package. Every other Globular client reaches services through globular_client, whose interceptor appends cluster_id and cluster_uid; the CLI never attached what it already had. Hence: routed to the local instance -> loopback exemption -> succeeds; --token supplied -> JWT exemption -> succeeds; neither -> Unauthenticated. Repository discovery rotates across instances, so the failure rate is the fraction of rotations that leave the node, which is why it read as an intermittent repository fault across three releases. Fixed by attaching membership metadata at all four CLI dial sites through one shared helper (clusterMetadataDialOptions), unary and stream. This is NOT an authorization change: nothing about who may do what moves.'
  revision_request: 'None. No authorization-boundary decision is required — the premise that prompted the question did not hold. LESSON, which is the durable part: an architectural explanation was constructed from an untested assumption about file permissions, when a single `etcdctl get /globular/system/cluster/id` and one look at the dial site would have disproved it in two minutes. Before filing a contract_unknown that asks an owner to move a boundary, verify the mechanism on a live system. A wrong architectural narrative is more expensive than an open question, because it redirects the people best placed to fix the real thing.'
  source_files:
  - golang/globularcli/cluster_metadata_interceptor.go
  - golang/globularcli/services_cmds.go
  evidence:
  - 'Live 1.2.363 cluster, 2026-09-04: ''etcdctl get /globular/system/cluster/id'' returns 0dea948b-c794-40d9-88af-a871bf2a11f2; /var/lib/globular/config/etcd_endpoints lists all five node IPs; the CLI runs as root via docker exec. dialRepository (services_cmds.go:925) and three sibling dial sites used raw grpc.DialContext with no interceptor; ''grep -c WithUnaryInterceptor golang/globularcli/*.go'' returned 0. Symptom history: 2 of 15 ''services desired set'' calls refused on 1.2.359; upgrade/deploy-publish-then-converge on 1.2.360; authority/rejoin-after-missed-generations and authority/controller-zombie-after-lease-loss on 1.2.361 — every one reporting Unauthenticated ''cluster_uid required after cluster initialization''.'
