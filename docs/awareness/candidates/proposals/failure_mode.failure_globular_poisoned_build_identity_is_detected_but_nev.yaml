proposal:
    status: awaiting_review
    proposed_by: agent
    kind: failure_mode
    id: failure.globular.poisoned_build_identity_is_detected_but_never_re_driven_dete
    title: Poisoned build identity is detected but never re-driven — detection and healing are separate capabilities
    description: 'An installed_state record whose ONLY defect is a non-canonical build_id is never re-examined by any convergence actor. cluster-doctor detects it (release.boundary_unproven, A2=FAILED), but no actor evaluates the package, so the wrong identity is permanent. The record looks served on every cheaper indicator — status=installed, version matches desired, runtime healthy, receipt metadata complete — and the re-drive predicate never reaches build identity. Fixing the writer that produces such records is therefore necessary but not sufficient: any record poisoned before the writer fix stays poisoned indefinitely, with the doctor reporting it forever and nothing acting. Preventing corruption of authoritative state and repairing already-corrupted authoritative state are distinct capabilities, and only the first exists.'
    severity: high
    source_files:
        - golang/cluster_controller/cluster_controller_server/release_pipeline.go
    related_failures:
        - global_state_lock_held_across_etcd_i_o_in_the_heartbeat_path_turns_one_slow_peer_into_a_false_cluster_wide_quorum_emergency
    evidence:
        - 'Controlled reproduction 2026-08-13 on a settled 1.2.317 cluster. T0 03:15:34Z baseline verified clean (0 ERROR, reduced_harvest false). T1 03:46:21Z: CAS-guarded single-field mutation of installed_state.buildId for event@node-3 from the desired 019ff913-1cf7-75c6-93e8-f88e055223a4 to deadbeef-1111-4222-8333-444455556666; read-back proved status, version, checksum and all 7 receipt metadata keys unchanged.'
        - '16-minute bounded observation: record unchanged at every 60s sample. cluster-doctor error count went 0 -> 1, so detection works.'
        - 'Actor trace over the same window: ZERO hasUnservedNodes or release lines naming event on the controller leader (node-1); node-3''s node-agent logged exactly one line naming event, a routine 43-service inventory report with no evaluation. No decline was logged because nothing evaluated it — this is absence of re-drive coverage, not a settlement precondition refusing.'
        - Conditional teardown restored the captured original and the doctor returned to the exact T0 baseline, confirming the single-field change was the whole cause.
    domain: github.com/globulario/services
    contract: A defect that cluster-doctor can detect in authoritative state must have a convergence actor that can act on it. Detection without a re-drive path leaves a permanent finding no operator action short of manual state surgery can clear.
