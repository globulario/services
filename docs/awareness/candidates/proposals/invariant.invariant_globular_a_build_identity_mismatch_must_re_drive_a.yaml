proposal:
    status: awaiting_review
    proposed_by: agent
    kind: invariant
    id: invariant.globular.a_build_identity_mismatch_must_re_drive_an_authoritative_app
    title: A build identity mismatch must re-drive an authoritative apply
    description: 'When desired build_id differs from installed build_id, the package is not served, regardless of how settled every cheaper indicator looks. Convergence identity is build_id (convergence.identity_is_build_id), so a record with status=installed, matching version, healthy runtime and a complete receipt is still unconverged if its identity disagrees with desired. The re-drive predicate must therefore include build identity, or a poisoned identity is unreachable by any corrective work. Demonstrated absent 2026-08-13: a record differing from healthy in exactly that one field was detected by cluster-doctor and evaluated by no convergence actor across a bounded window.'
    severity: high
    source_files:
        - golang/cluster_controller/cluster_controller_server/release_pipeline.go
    related_failures:
        - poisoned_build_identity_is_detected_but_never_re_driven_detection_and_healing_are_separate_capabilities
    forbidden_fixes:
        - Classify a package as served on version and runtime agreement while its build identity disagrees with desired
        - Clear a build-identity finding by hand-editing installed_state instead of scheduling an authoritative apply
    evidence:
        - 'Controlled reproduction on a settled 1.2.317 cluster: event@node-3 buildId changed from desired 019ff913-1cf7-75c6-93e8-f88e055223a4 to deadbeef-1111-4222-8333-444455556666, every other field byte-intact. 16 minutes, zero hasUnservedNodes or release lines naming the package on the controller leader, one routine inventory line on the owning node-agent, no repair attempt and no decline.'
        - cluster-doctor raised release.boundary_unproven A2=FAILED for the same record, so the mismatch was visible to the diagnostic plane throughout.
    domain: globular
    contract: desired build_id != installed build_id implies the node is unserved for that package and an authoritative apply must be scheduled. Version, status, runtime health and receipt completeness are not substitutes for identity agreement.
