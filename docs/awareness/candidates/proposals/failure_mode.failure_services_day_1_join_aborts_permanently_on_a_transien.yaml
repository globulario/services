proposal:
    status: awaiting_review
    proposed_by: agent
    kind: failure_mode
    id: failure.services.day_1_join_aborts_permanently_on_a_transient_gateway_network
    title: Day-1 join aborts permanently on a transient gateway network error during simultaneous bring-up
    description: 'The Day-1 join script waits for the founder''s gateway to accept TCP before proceeding, then calls /join/authorize. When several nodes are brought up simultaneously with the founder, that call can fail with a transport-level error while the founder''s gateway is still becoming ready to serve. The script treats it as terminal: "FAIL: join blocked: network error reaching gateway /join/authorize" then "[bootstrap] FATAL: join failed". The bootstrap unit is oneshot and does not retry, so the node never joins and never tries again — it sits running, with no cluster record, until an operator intervenes. Observed after an automated cluster rebuild where four of five nodes failed this way and the cluster stayed at 1/5 ready indefinitely. A refusal from the controller (identity conflict, bad token) is correctly terminal; a transport error is not, and the two are currently handled identically.'
    severity: high
    source_files:
        - scripts/release/install-day0.sh
    related_invariants:
        - join.token.validation
    evidence:
        - 'globular-quickstart 5-node sim, release 1.2.329, 2026-08-24 00:15:25: node-3 logged ''FAIL: join blocked: network error reaching gateway /join/authorize'' followed immediately by ''[bootstrap] FATAL: join failed'''
        - All five containers were up 39 minutes; the controller listed only node-1 as ready and the cluster remained at 1/5 with no further join attempts in the journal
        - The same nodes join successfully when brought up against an already-running founder, which is why this only appears on simultaneous bring-up (docker compose up after down -v)
    domain: github.com/globulario/services
    contract: A join must distinguish a transient reachability failure from a refusal. The gateway waits it already performs (for the join token, and for the founder's gateway port) establish that the founder comes up asynchronously; a network error on the very next call is the same transient condition and must be retried, not converted into a terminal FATAL that leaves the node permanently out of the cluster.
