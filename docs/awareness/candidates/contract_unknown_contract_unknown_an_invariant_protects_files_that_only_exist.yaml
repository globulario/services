contract_unknown:
  - id: contract_unknown.an_invariant_protects_files_that_only_exist_as_build_output
    kind: contract_unknown
    title: An invariant protects files that only exist as build output
    description: invariant service.endpoint.cgroup_escape_guard lists generated/specs/mcp_service.yaml and generated/payload/workflow/specs/workflow_service.yaml under protects.files. Both paths are gitignored build output with no authored counterpart anywhere in the tree — the only copies are regenerated by every build. The seed compiler emits a sourceFile triple for a protected file when it exists on disk, so the reference lands in golang/server/embeddata/awareness.nt only after a build has run. scripts/validate-package-authority.py then fails check-package-authority with 'golang/server/embeddata/awareness.nt references services/generated/specs but is not an allowlisted generator/build helper'. The result is a make check-services outcome that depends on whether a build ran, and an invariant anchored to bytes nothing authors.
    revision_request: 'Decide what service.endpoint.cgroup_escape_guard should actually anchor to — the spec generator (golang/deploy/specgen.go or globularcli/tools/specgen/specgen.sh), the service catalog entry, or the running unit — and drop the generated/ paths from protects.files. Alternatively, teach the seed compiler to skip gitignored paths, so build output can never enter the shipped graph. Do not resolve this by allowlisting awareness.nt in the validator: that would silence a correct rule rather than fix the reference.'
    source_files:
      - docs/awareness/invariants.yaml
      - scripts/validate-package-authority.py
    evidence:
      - docs/awareness/invariants.yaml line 8936-8937 under id service.endpoint.cgroup_escape_guard. Reference present since ad24a3a2 (2026-05-07). find for mcp_service.yaml outside generated/ and dist/ returns only ./golang/generated/specs/mcp_service.yaml and ./golang/generated/payload/mcp/specs/mcp_service.yaml — both build output. sensei build --output with the directory absent still emits the triple, confirming the source is the YAML, not a filesystem scan.
