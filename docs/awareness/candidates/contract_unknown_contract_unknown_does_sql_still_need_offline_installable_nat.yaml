contract_unknown:
  - id: contract_unknown.does_sql_still_need_offline_installable_native_deps_given_ev
    kind: contract_unknown
    title: Does sql still need offline-installable native deps, given every node reaches the Ubuntu archive?
    description: 'The bundling contract for sql may no longer match deployment reality, and the cost of honouring it has become visible. specgen emits bundle_debs: [libodbc2] for sql because a joining node was assumed unable to reach the Ubuntu archive. That premise turns sql into a release-input problem: pkg build refuses bundled debs without a declared package-source revision AND a declared platform baseline, and provenance is resolved through git — so apt-downloaded bytes, which have no owning repository, can never satisfy it. Shipping sql therefore costs five steps across two repos plus a release-pin bump, for one stock Ubuntu library, with no scripted procedure. Measurement now contradicts the premise. The question is whether offline-installability of native dependencies is a standing requirement or was inferred from a single incident on a cluster that had archive access throughout.'
    revision_request: 'Decide whether offline-installability of native dependencies is a standing requirement. IF YES: the gap is ergonomic — vendoring needs a documented, scripted procedure (packages/scripts/vendor-debs.sh) so the next native dependency costs one command, not a day; scylladb''s 19 vendored debs were produced by hand and the procedure was never written down. IF NO: retire bundle_debs for sql in favour of an install-time dependency step, rewrite TestSpecgenBundlesNativeDebsForSQL, and amend the contract line on failure.sql_install_aborts_on_missing_libodbc_so_2_failing_node_join — release-input provenance then leaves sql''s critical path entirely. This is NOT a request to weaken the provenance gate, which is correct for anything that genuinely must ship third-party bytes; the question is only whether sql is such a package.'
    evidence:
      - '2026-08-22, 5-node cluster: all five nodes (10.0.0.63/.8/.20/.9/.102) return HTTP 200 from archive.ubuntu.com/ubuntu/dists/noble/Release, and libodbc2 is already installed (dpkg ii) on the nodes sampled — the condition bundling defends against is absent. Meanwhile ''scripts/build-release.sh 1.2.328 --full-regenerate'' fails closed: ''[FAIL] sql: release input provenance: no package source manifest declared, so the authorized revision for 2 bundled deb(s) is unknown''. The original incident''s own evidence reads ''sql is the only Globular service linking a native library; its generated spec was the generic pure-Go template with no bundle_debs'' — i.e. nothing installed it at all. Bundling fixed that, but so would an install-time dependency step; the spec vocabulary has no apt step type today (only ensure_dirs/ensure_user_group/ensure_service_config/install_package_payload/install_services/enable_services/start_services/health_checks, plus install_local_debs used solely by sql).'
