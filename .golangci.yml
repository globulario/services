version: "2"

linters:
  exclusions:
    warn-unused: true
    rules:
      # These readers are opened only to inspect an immutable local archive.
      # Their Close methods cannot change the parsed result, and the functions
      # deliberately return a zero identity on every read/decode failure.
      # Keep the exception source-scoped so other ignored close errors remain
      # visible to errcheck. The CI linter runs with --path-mode=abs, so match
      # the stable repository-relative suffix rather than anchoring at column 0.
      - path: '(^|/)node_agent/node_agent_server/installer_api\.go$'
        source: '^\s*defer (f|gz)\.Close\(\)$'
        linters:
          - errcheck
